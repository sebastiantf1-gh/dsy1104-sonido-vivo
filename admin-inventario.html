<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Inventario</title>
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/funciones.js" defer></script>
  </head>
  <body class="vista-admin-body">
    <div class="vista-admin-container">
      <header>
        <img
          src="img/logo.jpg"
          alt="logo de sonido vivo"
          class="logo-principal"
        />

        <h1>
          Sonido <br />
          Vivo
        </h1>

        <nav>
          <ul>
            <li><a href="#">Dashboards</a></li>
            <!-- hay que agregar el link a la pagina de dashboard y a las otras -->
            <li><a href="#">Gestión de pedidos</a></li>
            <li><a href="#">Gestión de inventario</a></li>
          </ul>
        </nav>

        <!-- hay que agregar item para especificar el usuario y hacer cerrar sesion -->
      </header>

      <main>
        <section>
          <h2>Gestión de Inventario</h2>
          <section class="vista-admin-filtros">
            <label for="filtros"></label>
            <input type="text" id="filtros" name="filtros" placeholder="Buscar por nombre o código" />
            <button class="admin-btn">Filtrar</button>
          </section>

          <table class="tabla-vista-admin">
            <thead>
              <tr>
                <th scope="col">Nombre</th>
                <th scope="col">Cod. Producto</th>
                <th scope="col">Categoria</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpo-tabla-inventario">
              <!-- Aquí se llenará dinámicamente con JavaScript -->
            </tbody>
          </table>
        </section>
      </main>
    </div>
    <footer class="vista-admin-footer">
      <div class="footer-info">
        <p>&copy; 2023 Sonido Vivo. Todos los derechos reservados.</p>
        <p class="estado-sistema">En línea</p>
      </div>
      <div class="footer-ayuda">
        <a href="#">Ayuda</a>
        <p>Versión 1.0.0 (Prototipo Parcial01)</p>
      </div>
    </footer>
  </body>
</html>
