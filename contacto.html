<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>

</head>
<body>
    <main>
        <section id = "contacto">
            <h1>Contacto</h1>
            <form id="form-contacto">
                <label for="nombre">Nombre Completo:</label>
                <input type="text" id="nombre" required>

                <label for="email">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="email@ejemplo.cl" required>

                <label for="telefono">Telefono:</label>
                <input type="tel" id="telefono" placeholder="912345678" pattern="[0-9]{9}" 
  title="Debe contener 9 dígitos numéricos" required>

                <label for="motivo">Motivo de la Consulta:</label>
                <select id="motivo" required>
                    <option value="">Seleccione una opción</option>
                    <option>Consultas generales</option>
                    <option>Reclamo</option>
                    <option>Otro</option>
                </select>

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" required placeholder="Escriba su consulta aquí."></textarea>

                <button type="submit">Enviar</button>
                <p id="mensaje-confirmado"></p>
            </form>
        </section>
    </main>
    
</body>
</html>
