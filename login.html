<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesion</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>

</head>

<body class="login-body">
    <header id="header-login">
        <img src="img/logo.jpg" alt="logo sonido vivo">
    </header>
    <main class="login-container">
        <form id="login" novalidate>
            <label for="correo-login">Correo electrónico</label>
            <input type="email" id="correo-login" required>
            <span class="error" id="error-correo"></span>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" required>
            <span class="error" id="error-contrasena"></span>

            <button class="button" type="submit">Iniciar Sesion</button>
            <p id="mensaje-confirmacion"></p>
        </form>
    </main>
</body>

</html>
